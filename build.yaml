overview: "Letterboxd reviews, ratings and taste-based movie recommendations for your library."
description: >
  Pulls your Letterboxd diary and reviews from the official RSS feed, matches them to
  items in your Jellyfin library, builds a taste profile from your ratings, and uses
  TMDB recommendations to suggest similar movies you already own — plus a list of
  movies worth adding. Results surface as a playlist, a sidebar page, and a dashboard
  config page.
