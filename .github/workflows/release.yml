name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build plugin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build plugin with JPRM
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@v1.1.1
        with:
          dotnet-target: net10.0

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: ${{ steps.jprm.outputs.artifact }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true

  manifest:
    name: Update plugin repository manifest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Download plugin package
        uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jprm
        run: pip install jprm

      - name: Update manifest.json
        env:
          REPO_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.event.repository.default_branch }}
        run: |
          jprm repo init . || true
          jprm repo add --url "$REPO_URL" . ./dist/*.zip

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json letterboxd
          if git diff --cached --quiet; then
            echo "Manifest unchanged; nothing to commit."
          else
            git commit -m "Update plugin manifest for ${GITHUB_REF_NAME}"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi